version: '3.8'

services:
  # LiveKit SFU Server
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"   # HTTP API
      - "7881:7881"   # RTC (WebRTC)
      - "7882:7882"   # TURN/UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  # Redis for session cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Game Server
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      # Internal URL for container-to-container communication
      - LIVEKIT_WS_URL_INTERNAL=ws://livekit:7880
      # External URL exposed in tokens for mobile clients
      - LIVEKIT_WS_URL_EXTERNAL=${LIVEKIT_WS_URL_EXTERNAL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - DATABASE_PATH=/data/dreamweaver.db
      # Ollama LLM Game Master (server-side dynamic narration).
      # Points at the RTX-4090 workstation (DickMammoth, 10.10.1.96) for GPU
      # inference — the VM has no GPU and CPU inference of a large model OOM-kills
      # the memory-oversubscribed Proxmox host. Override via .env if the box moves.
      - OLLAMA_URL=${OLLAMA_URL:-http://10.10.1.96:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.6:27b}
    volumes:
      - server_data:/data
    depends_on:
      - redis
      - livekit
      - ollama
    restart: unless-stopped

  # AI Agent (GM + STT + TTS)
  agent:
    build:
      context: ../apps/agent
      dockerfile: Dockerfile
    environment:
      # Internal URL for agent connecting to LiveKit
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Server URL for event emission (internal docker network)
      - SERVER_URL=http://server:3000
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - WHISPER_MODEL=small.en
    depends_on:
      - livekit
      - ollama
      - server
      - redis
    restart: unless-stopped

  # Ollama LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    restart: unless-stopped

volumes:
  redis_data:
  server_data:
  ollama_data:

networks:
  default:
    name: dreamweaver
