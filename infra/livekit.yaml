# LiveKit Server Configuration
# https://docs.livekit.io/realtime/self-hosting/deployment/

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: true

# TURN server (disabled for local development)
# For production, enable TURN with a domain for NAT traversal
turn:
  enabled: false

# Redis for distributed state (optional for single-node)
# redis:
#   address: redis:6379

# Logging
logging:
  level: info
  json: false

# Room settings
room:
  enabled_codecs:
    - mime: audio/opus
  max_participants: 10
  empty_timeout: 300  # 5 minutes
  departure_timeout: 60  # 1 minute grace for reconnect

# Keys are set via environment variable LIVEKIT_KEYS
